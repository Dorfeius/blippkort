<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blippkort</title>
<style>
  :root { --bg:#fff8ef; --card:#fff; --ink:#231f3a; --muted:#77728c; --line:#e9e2f6;
          --accent:#6c4cff; --accent-d:#4a2fd1; --ok:#12a66a; --bad:#e5484d;
          --blob1:#ffd9ec; --blob2:#d6ecff; --blob3:#fff0b8; --shadow:0 10px 28px rgba(70,45,140,.12); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141226; --card:#1f1c38; --ink:#f3f1ff; --muted:#a6a1c4; --line:#353060;
            --blob1:#3a1d4d; --blob2:#16294d; --blob3:#3d3215; --shadow:0 10px 28px rgba(0,0,0,.4); }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; min-height:100vh; color:var(--ink);
         font:600 17px/1.45 ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background:radial-gradient(circle at 0% 0%, var(--blob1), transparent 42%),
                    radial-gradient(circle at 100% 8%, var(--blob2), transparent 45%),
                    radial-gradient(circle at 50% 100%, var(--blob3), transparent 50%), var(--bg);
         background-attachment:fixed; }
  header { display:flex; align-items:center; gap:10px; padding:14px 16px 8px; max-width:640px; margin:0 auto; }
  header h1 { font-size:26px; font-weight:900; letter-spacing:-.5px; margin:0; flex:1;
         background:linear-gradient(90deg,#6c4cff,#ff5ca8,#ff9d2e); -webkit-background-clip:text; background-clip:text; color:transparent; }
  main { max-width:640px; margin:0 auto; padding:0 16px 56px; }
  button { font:inherit; font-weight:800; border:0; background:var(--card); color:var(--ink); padding:12px 18px;
           border-radius:999px; cursor:pointer; box-shadow:0 4px 0 var(--line); transition:transform .08s, box-shadow .08s; }
  button:active { transform:translateY(3px); box-shadow:0 1px 0 var(--line); }
  button.primary, button.on { background:var(--accent); color:#fff; box-shadow:0 4px 0 var(--accent-d); }
  button.primary:active, button.on:active { box-shadow:0 1px 0 var(--accent-d); }
  button.danger { color:var(--bad); }
  button:disabled { opacity:.4; }
  input, select { font:inherit; padding:10px 14px; border:2px solid var(--line); border-radius:14px;
          background:var(--card); color:var(--ink); max-width:100%; }
  .panel { background:var(--card); border-radius:26px; padding:20px; margin:16px 0; box-shadow:var(--shadow);
           border:2px solid transparent; animation:pop .35s cubic-bezier(.2,1.4,.4,1) both; }
  .warn { border-color:var(--bad); }
  .muted { color:var(--muted); font-weight:500; } .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .center { text-align:center; } .big { font-size:64px; line-height:1; }
  h2 { margin:10px 0 6px; font-size:26px; font-weight:900; } h3 { margin:0 0 10px; font-weight:900; }
  .modes { display:flex; gap:8px; overflow-x:auto; padding:6px 2px 12px; scrollbar-width:none; }
  .modes::-webkit-scrollbar { display:none; } .modes button { flex:none; padding:10px 16px; }

  /* väntläge: pulserande ringar */
  .wait { padding:36px 16px 28px; }
  .pulse { position:relative; width:150px; height:150px; margin:0 auto 10px; display:grid; place-items:center; font-size:64px; }
  .pulse i { position:absolute; inset:0; border-radius:50%; border:4px solid var(--accent); opacity:0; animation:ring 2.4s ease-out infinite; }
  .pulse i:nth-child(2) { animation-delay:.8s; border-color:#ff5ca8; } .pulse i:nth-child(3) { animation-delay:1.6s; border-color:#ff9d2e; }
  .pulse span { animation:bob 2.4s ease-in-out infinite; }

  /* själva kortet: färgen följer pennnivån */
  .hero { color:#fff; border-radius:28px; padding:20px; margin:16px 0 12px; position:relative; overflow:hidden;
          box-shadow:var(--shadow); animation:pop .4s cubic-bezier(.2,1.4,.4,1) both; }
  .hero::after { content:""; position:absolute; right:-50px; top:-60px; width:190px; height:190px; border-radius:50%; background:rgba(255,255,255,.16); }
  .lv1 { background:linear-gradient(135deg,#4f8cff,#7c5cff); } .lv2 { background:linear-gradient(135deg,#0fb98a,#0c9fd1); }
  .lv3 { background:linear-gradient(135deg,#b25cff,#ff5ca8); } .lv4 { background:linear-gradient(135deg,#ffb300,#ff6f1e); }
  .lv5 { background:linear-gradient(135deg,#ff5c5c,#ffb300,#22c58b,#4f8cff,#b25cff); }
  .hero-top { display:flex; justify-content:space-between; gap:8px; position:relative; z-index:1; }
  .chip { background:rgba(255,255,255,.24); padding:4px 12px; border-radius:999px; font-size:14px; font-weight:800; }
  .pen { font-size:32px; font-weight:900; letter-spacing:-.5px; margin:14px 0 10px; position:relative; z-index:1; }
  .slots { display:flex; flex-wrap:wrap; gap:4px; font-size:26px; line-height:1; position:relative; z-index:1; }
  .slots span { filter:grayscale(1) brightness(2.2); opacity:.38; }
  .slots .full { filter:none; opacity:1; animation:pop .4s cubic-bezier(.2,1.6,.4,1) both; }
  .bar { height:16px; border-radius:8px; background:rgba(255,255,255,.3); overflow:hidden; }
  .bar i { display:block; height:100%; background:#fff; border-radius:8px; }
  .goal { margin:10px 0 0; position:relative; z-index:1; }

  .tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:12px 0 16px; }
  .tile { background:var(--card); border-radius:22px; padding:12px 6px; text-align:center; box-shadow:var(--shadow);
          font-size:14px; animation:pop .4s cubic-bezier(.2,1.4,.4,1) both; }
  .tile:nth-child(2) { animation-delay:.06s; } .tile:nth-child(3) { animation-delay:.12s; }
  .tile em { display:grid; place-items:center; width:44px; height:44px; margin:0 auto 4px; border-radius:50%; font-style:normal; font-size:22px; }
  .tile:nth-child(1) em { background:rgba(255,190,0,.22); } .tile:nth-child(2) em { background:rgba(255,92,168,.2); } .tile:nth-child(3) em { background:rgba(79,140,255,.2); }
  .tile b { display:block; font-size:40px; font-weight:900; line-height:1.05; }
  .tile .row { justify-content:center; margin-top:10px; gap:6px; flex-wrap:nowrap; }
  .tile button { padding:8px 12px; }
  .still .hero, .still .tile, .still .slots .full { animation:none; }
  .banner { display:inline-block; background:var(--ok); color:#fff; padding:8px 16px; border-radius:999px; margin-top:12px;
            animation:pop .4s cubic-bezier(.2,1.6,.4,1) both; }
  .note { display:inline-block; max-width:100%; border-radius:18px !important; background:var(--card); padding:8px 16px; border-radius:999px; margin-top:12px; box-shadow:var(--shadow); }
  .tile { position:relative; }
  .tile.hot { outline:3px solid var(--accent); }
  .badge { position:absolute; top:-10px; right:-6px; background:var(--accent); color:#fff; font-weight:900; font-size:15px;
           padding:3px 10px; border-radius:999px; box-shadow:0 3px 0 var(--accent-d); }
  .spacer { height:170px; }
  .confirm { position:fixed; left:50%; bottom:14px; width:min(608px, calc(100vw - 24px)); margin-left:calc(min(608px, 100vw - 24px) / -2);
             z-index:4; display:flex; align-items:center; gap:14px; padding:16px; border-radius:30px; color:#fff;
             background:linear-gradient(135deg,#6c4cff,#ff5ca8); box-shadow:0 14px 34px rgba(80,40,160,.45); transform-origin:50% 100%; }
  .confirm.grow { animation:grow .55s cubic-bezier(.2,1.5,.4,1) both; }
  .confirm.puff { animation:puff .3s ease-out both; }
  .confirm-icon { position:relative; flex:none; width:74px; height:74px; display:grid; place-items:center; font-size:38px;
                  background:rgba(255,255,255,.2); border-radius:50%; }
  .confirm-icon i { position:absolute; inset:0; border-radius:50%; border:3px solid #fff; opacity:0; animation:ring 1.6s ease-out infinite; }
  .confirm-icon i:nth-child(2) { animation-delay:.8s; }
  .confirm-icon span { animation:bob 1.2s ease-in-out infinite; }
  .confirm-text { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .confirm-text b { font-size:20px; font-weight:900; line-height:1.15; }
  .confirm-text span { font-size:18px; font-weight:800; }
  .confirm-text small { opacity:.85; font-weight:600; }
  .confirm button { flex:none; background:rgba(255,255,255,.22); color:#fff; box-shadow:none; padding:10px 14px; }
  .count { height:6px; border-radius:3px; background:rgba(255,255,255,.3); overflow:hidden; margin-top:8px; }
  .count i { display:block; height:100%; background:#fff; transform-origin:0 50%; animation:shrink linear forwards; }
  .panel .count { background:var(--line); } .panel .count i { background:var(--accent); }
  .armed { margin:16px 0; padding:30px 20px 24px; border-radius:30px; color:#fff; text-align:center;
           background:linear-gradient(135deg,#6c4cff,#ff5ca8); box-shadow:0 14px 34px rgba(80,40,160,.45);
           animation:grow .5s cubic-bezier(.2,1.5,.4,1) both; }
  .armed h2 { font-size:28px; line-height:1.2; margin:18px 0 8px; } .armed p { margin:6px 0; }
  .armed .what { display:inline-block; background:#fff; color:#4a2fd1; padding:2px 14px; border-radius:999px; white-space:nowrap; }
  .armed button { margin-top:18px; background:rgba(255,255,255,.22); color:#fff; box-shadow:none; }
  .big-icon { width:120px; height:120px; font-size:60px; margin:0 auto; }
  .adding { border-color:var(--ok); }
  @keyframes shrink { from { transform:scaleX(1); } to { transform:scaleX(0); } }
  @keyframes grow { from { transform:scale(.15); opacity:0; } to { transform:scale(1); opacity:1; } }
  @keyframes puff { 0% { transform:scale(1); } 45% { transform:scale(1.05); } 100% { transform:scale(1); } }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 6px; border-bottom:2px solid var(--line); }
  .n { text-align:right; font-variant-numeric:tabular-nums; }
  #msg { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--ink); color:var(--bg);
         padding:12px 18px; border-radius:18px; display:none; max-width:90vw; z-index:5; box-shadow:var(--shadow); }
  .confetti { position:fixed; top:-40px; font-size:26px; pointer-events:none; z-index:9; animation:fall linear forwards; }
  @keyframes pop { from { transform:scale(.88); opacity:0; } to { transform:scale(1); opacity:1; } }
  @keyframes ring { 0% { transform:scale(.45); opacity:.9; } 100% { transform:scale(1.15); opacity:0; } }
  @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
  @keyframes fall { to { transform:translateY(110vh) rotate(540deg); opacity:.9; } }
  /* stor skärm (t.ex. Chromebook): förstora allt så att det syns på håll */
  @media (min-width: 900px) { header, main { zoom:1.35; } }
  @media (min-width: 1400px) { header, main { zoom:1.6; } }
  /* skärmläge på bred skärm: kortet till vänster, valen till höger, allt synligt utan att rulla */
  @media (min-width: 900px) {
    body.wide header, body.wide main { max-width:1000px; }
    .split { display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start; }
  }
  .armed .what { white-space:normal; }
  .choices { display:grid; gap:12px; } .choices button { font-size:20px; padding:16px 18px; text-align:left; }
  #fsBtn.on { background:var(--accent); color:#fff; box-shadow:0 4px 0 var(--accent-d); }
  @media (prefers-reduced-motion: reduce) { *:not(.count i) { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<header>
  <h1>Blippkort</h1>
  <button id="fsBtn" onclick="toggleKiosk()" aria-label="Helskärm" title="Helskärm" style="padding:10px 12px;line-height:0">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path id="fsIcon" d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg></button>
  <button id="cloud" hidden onclick="if(secret)show({name:'sync'})" style="padding:8px 12px"></button>
  <button id="nfcBtn" class="primary">Starta NFC</button>
  <button id="lockBtn" hidden onclick="unlock()" aria-label="Lås upp" title="Lås upp" style="padding:8px 12px">🔒</button>
  <button id="adminBtn">Admin</button>
</header>
<main id="app"></main>
<div id="msg"></div>

<script>
"use strict";
/* Saldot ligger på själva kortet. Sidan har ingen server och skickar ingenting någonstans.
   Admin-mobilen sparar hemlig nyckel, pennnivåer och en namnlös kopia per kortnummer lokalt. */
const MIME = "application/x-bk";
const DEFAULT_LEVELS = [{ name: "Blyertspenna", cost: 0 }, { name: "Stiftpenna", cost: 5 },
                        { name: "Gelpenna", cost: 10 }, { name: "Guldpenna", cost: 15 }];
const ICON = { s: "⭐", e: "🧽", p: "✏️" };
const QUICK = [["s", 1], ["e", -1], ["p", -1]];       // snabbval: gäller ETT kort, sedan läser appen bara igen
const PEND_MS = 40000;                                // så länge väntar en ändring på sitt blipp
const $ = (s) => document.querySelector(s);
const app = $("#app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const SYNCED = ["bk_cards", "bk_bonus", "bk_done", "bk_log", "bk_levels", "bk_cfg"];   // det som också sparas i registret på GitHub
let quietSave = false;
const save = (k, v) => {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch { toast("Kunde inte spara i mobilen"); }
  if (!quietSave && SYNCED.includes(k)) queueSync();
};
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

let secret = load("bk_key", null);        // satt = den här mobilen är admin
let levels = load("bk_levels", DEFAULT_LEVELS);
let cfg = { se: 2, sp: 4, ve: 2, vp: 1, ...load("bk_cfg", {}) };   // start-sudd, start-pennor, värde per sudd/penna i ⭐
let bonus = load("bk_bonus", {});         // väntande ändringar: kortnummer -> [{ id, k: fält, a: antal, t: text }], läggs på vid nästa blipp
for (const list of Object.values(bonus)) for (const g of list) { g.id = g.id || rid(); g.k = g.k || "s"; }
let done = load("bk_done", []);           // id:n på väntande ändringar som redan förts över eller tagits bort
let log = load("bk_log", []);             // händelser: [{ id, ts, n, t, by }]
let cfgTs = load("bk_cfgts", 0);
let role = load("bk_role", null);         // { screen: true, code }: enheten är en skärm som visar saldot
let station = load("bk_station", false);  // den här mobilen är läsare åt skärmen
let scan = load("bk_scan", null);         // senaste blippet från läsaren: det skärmen visar
let req = load("bk_req", null);           // elevens val på skärmen som väntar på ett bekräftande blipp
const ACTS = { "p-1": ["p", -1], "e-1": ["e", -1], up: ["up", 0] };
const ACT_TEXT = { "p-1": "−1 ✏️ (hämta en penna)", "e-1": "−1 🧽 (hämta ett sudd)", up: "⬆️ ny penna" };
let gh = load("bk_gh", null);             // { repo, token, who }: koppling till registret på GitHub
let backup = load("bk_cards", {});        // kortnummer -> senast kända läge
let adding = false;                       // "lägg till nya kort": skriver bara på tomma, okända kort
let view = { name: "wait" };
let pending = null;                       // det enda som får ändra ett kort: { uid, state } eller { quick: [fält, ändring] }
let reader = null, busy = false, clearTimer = null;

function toast(text) {
  const m = $("#msg"); m.textContent = text; m.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => (m.style.display = "none"), 3500);
}
const buzz = (ok) => { try { navigator.vibrate(ok ? 60 : [80, 60, 80]); } catch {} };
const normUid = (s) => String(s || "").replace(/[^0-9a-z]/gi, "").toUpperCase();

// ---------- kortets innehåll ----------
async function signature(uid, st) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey("raw", enc.encode(secret), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  const msg = [uid, st.n, st.s, st.e, st.p, st.l, st.g, st.c].join("|");
  const mac = new Uint8Array(await crypto.subtle.sign("HMAC", key, enc.encode(msg))).slice(0, 9);
  return btoa(String.fromCharCode(...mac));
}
const nextCost = (level) => (levels[level] ? levels[level].cost : 0);   // level är 1-baserad; levels[level] = nästa nivå
const clean = (st) => ({ v: 1, n: st.n, s: st.s, e: st.e, p: st.p, l: st.l, g: nextCost(st.l), w: worth(st), c: st.c });
const worth = (st) => st.s + st.e * cfg.ve + st.p * cfg.vp;

function parseCard(message) {
  for (const r of message.records) {
    if (r.recordType === "mime" && r.mediaType === MIME) {
      try {
        const o = JSON.parse(new TextDecoder().decode(r.data));
        if ([o.n, o.s, o.e, o.p, o.l, o.c].every(Number.isInteger)) return o;
      } catch {}
    }
  }
  return null;
}

async function writeCard(uid, st) {
  const out = clean({ ...st, c: st.c + 1 });
  out.h = await signature(uid, out);
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 6000);
  try {
    await reader.write({ records: [{ recordType: "mime", mediaType: MIME,
      data: new TextEncoder().encode(JSON.stringify(out)) }] }, { signal: ctl.signal });
  } finally { clearTimeout(timer); }
  const prev = backup[out.n] && backup[out.n].uid === uid ? backup[out.n] : null;
  const parts = prev ? ["s", "e", "p"].filter((k) => out[k] !== prev[k]).map((k) => `${signed(out[k] - prev[k])} ${ICON[k]}`) : ["nytt kort"];
  if (prev && out.l !== prev.l) parts.push("penna: " + (levels[out.l - 1] ? levels[out.l - 1].name : out.l));
  addLog(out.n, parts.join(", ") || "skrivet på nytt");
  backup[out.n] = { uid, s: out.s, e: out.e, p: out.p, l: out.l, c: out.c, ts: Date.now() };
  save("bk_cards", backup);
  return out;
}

// ---------- ett blipp ----------
async function onTap(serial, message) {
  if (busy) return;
  busy = true; if (adding) armAdding();
  try {
    if (station) await stationTap(normUid(serial), parseCard(message));
    else await handleTap(normUid(serial), parseCard(message));
  } catch (e) {
    buzz(false);
    if (station) { disarm(); publishScan({ status: "retry" }); show({ name: "station" }); }
    else show({ name: "fail" });
  }
  finally { busy = false; }
}

// Grundregel: ett blipp LÄSER bara. Kortet ändras endast om något väntar synligt på skärmen (pending),
// och det som väntar gäller ett enda kort och släpper av sig självt efter en stund.
let pendTimer = null;
function arm(job) {
  pending = job; clearTimeout(pendTimer);
  pendTimer = setTimeout(() => {
    if (!pending || busy) return;
    pending = null; toast("Avbrutet: inget kort blippades i tid. Inget ändrades."); show({ name: "wait" });
  }, PEND_MS);
}
function disarm() { pending = null; clearTimeout(pendTimer); }
const signed = (d) => (d > 0 ? "+" : "−") + Math.abs(d);
const quickLabel = (q) => (q[0] === "up" ? "⬆️ ny penna" : `${signed(q[1])} ${ICON[q[0]]}`);
function applyQuick(st, q) {              // true om ändringen gick att göra
  if (!q) return false;
  if (q[0] === "up") {
    const cost = nextCost(st.l);
    if (!cost || st.s < cost) return false;
    st.s -= cost; st.l += 1; return true;
  }
  if (st[q[0]] + q[1] < 0) return false;
  st[q[0]] += q[1]; return true;
}
// ----- läsarläge: mobilen läser, skärmen visar. Ett kort ändras bara om eleven valt något på skärmen
// och sedan blippar SAMMA kort igen inom en kort stund.
let reqSeen = { id: "", t: 0 };
function activeReq() {
  if (!req || req.state !== "wait") return null;
  if (reqSeen.id !== req.id) reqSeen = { id: req.id, t: Date.now() };     // räkna tiden från att mobilen såg valet
  return Date.now() - reqSeen.t < 45000 ? req : null;
}
const later = (old) => Math.max(Date.now(), ((old && old.at) || 0) + 1);  // klockor på olika enheter går inte exakt lika
function saveQuiet(k, v) { quietSave = true; save(k, v); quietSave = false; }
function setReq(r) { req = { ...r, at: later(req) }; saveQuiet("bk_req", req); }
function publishScan(s) { scan = { id: rid(), at: later(scan), ...s }; saveQuiet("bk_scan", scan); pushNow(); }
async function stationTap(uid, card) {
  const r = activeReq(), mine = !!r && r.uid === uid;
  if (r && !mine) setReq({ ...r, state: "cancel" });                      // ett annat kort blippades: valet gäller inte längre
  clearTimeout(pendTimer); pending = mine ? { quick: ACTS[r.act] } : null;
  await handleTap(uid, card);
  const v = view, okCard = v.name === "edit", st = okCard ? v.orig : null;
  const did = mine && okCard && !!v.again;
  if (mine) setReq({ ...r, state: did ? "done" : "fail" });
  publishScan({ uid, status: okCard ? "ok" : v.name === "bad" ? "bad" : "blank", n: st ? st.n : 0,
    st: st && { n: st.n, s: st.s, e: st.e, p: st.p, l: st.l, g: nextCost(st.l) },
    note: v.note || "", did: did ? r.act : "", reqId: mine ? r.id : "" });
  show({ name: "station", last: st ? `Kort nr ${st.n}${did ? ": " + ACT_TEXT[r.act] : " avläst"}` : "Kortet gick inte att visa" });
}
const opened = (uid, st, extra = {}) => show({ name: "edit", uid, st: { ...st }, orig: st, ...extra });

async function handleTap(uid, card) {
  if (!uid) return toast("Kortet saknar ID");
  if (!secret) return show(card ? { name: "card", uid, st: card } : { name: "blank", uid });   // elevläge: bara visa

  if (pending && pending.uid) {                    // en ändring väntar på just det här kortet
    if (uid !== pending.uid) { buzz(false); return toast("Det är inte samma kort. Blippa kortet du ändrade."); }
    const { state, oldN, created } = pending, before = backup[state.n];
    const st = await writeCard(uid, state);
    if (oldN && oldN !== st.n) {                   // kortet har fått nytt nummer: flytta kopia och väntande bonus
      if (backup[oldN] && backup[oldN].uid === uid) { delete backup[oldN]; save("bk_cards", backup); }
      if (bonus[oldN]) { bonus[st.n] = [...(bonus[st.n] || []), ...bonus[oldN]]; delete bonus[oldN]; save("bk_bonus", bonus); }
    }
    disarm(); buzz(true);
    return opened(uid, st, { saved: true, created, party: !!before && st.l > before.l });
  }
  const quick = pending && pending.quick;          // snabbval: gäller bara det här blippet

  if (!card) {                                     // tomt kort
    // Känner mobilen igen taggen har en skrivning avbrutits och tömt kortet: lägg tillbaka kopian direkt.
    const lostN = Object.keys(backup).find((k) => backup[k].uid === uid);
    if (lostN) {
      const b = backup[lostN], base = { n: Number(lostN), s: b.s, e: b.e, p: b.p, l: b.l, c: b.c };
      const did = applyQuick(base, quick);
      const st = await writeCard(uid, base);
      disarm(); buzz(true);
      return opened(uid, st, { saved: true, note: "Kortet hade tappat sin data (avbruten skrivning) och är återställt från kopian."
        + (did ? "" : " Gör om din senaste ändring."), again: did ? quick : null });
    }
    disarm();
    if (!adding) return show({ name: "blank", uid });
    const n = upcoming(); wantN = backup[n + 1] ? null : n + 1;
    const st = await writeCard(uid, { n, s: 0, e: cfg.se, p: cfg.sp, l: 1, c: 0 });
    buzz(true);
    return opened(uid, st, { saved: true, created: true });
  }

  const valid = card.h === await signature(uid, card);
  const known = backup[card.n];
  const bad = !valid ? "sig" : known && known.uid !== uid ? "dup" : known && known.c > card.c ? "old" : "";
  if (bad) {
    addLog(card.n, "⚠️ kortet stämde inte: " + { sig: "ändrat utifrån eller fel nyckel", dup: "kopia av ett annat kort", old: "gammalt saldo tillbakalagt" }[bad]);
    disarm(); return show({ name: "bad", uid, card, reason: bad });
  }
  if (!known || known.c < card.c) {                // kortet ändrat av annan admin-mobil med samma nyckel
    backup[card.n] = { uid, s: card.s, e: card.e, p: card.p, l: card.l, c: card.c, ts: Date.now() };
    save("bk_cards", backup);
  }

  const gifts = (bonus[card.n] || []).filter((g) => !done.includes(g.id));   // ändringar från registret sedan sist
  const st = { ...card }, sums = { s: 0, e: 0, p: 0 };
  for (const g of gifts) sums[g.k] += g.a;
  for (const k of ["s", "e", "p"]) st[k] = Math.max(0, st[k] + sums[k]);
  const extra = gifts.length > 0;
  const what = ["s", "e", "p"].filter((k) => st[k] !== card[k]).map((k) => `${signed(st[k] - card[k])} ${ICON[k]}`).join(", ");
  const why = gifts.map((g) => g.t).filter(Boolean).join(", ");
  let note = extra ? `${sums.s > 0 && !sums.e && !sums.p ? "🎁 Bonus" : "📝 Från registret"}: ${what || "ingen ändring"}${why ? " (" + why + ")" : ""}` : "";
  const did = applyQuick(st, quick);
  if (quick && !did) { buzz(false); note = ("Saldot är redan 0, inget ändrat. " + note).trim(); }
  if (adding) note = ("Kortet är redan klart (nr " + card.n + "). " + note).trim();

  if (extra || did) {
    const written = await writeCard(uid, st);
    if (extra) { done = [...done, ...gifts.map((g) => g.id)].slice(-400); delete bonus[card.n]; save("bk_done", done); save("bk_bonus", bonus); }
    disarm(); buzz(true);
    return opened(uid, written, { saved: true, note, party: sums.s > 0, again: did ? quick : null });
  }
  disarm();
  opened(uid, card, { note });                     // standard: läs bara av kortet
}

function addLog(n, t) {
  log.push({ id: rid(), ts: Date.now(), n, t, by: (gh && gh.who) || "" });
  log = log.slice(-300); save("bk_log", log);
}
function nextNumber() { let n = 1; while (backup[n]) n++; return n; }
let wantN = null;                         // nummer som admin valt för nästa nya kort
const upcoming = () => (wantN && !backup[wantN] ? wantN : nextNumber());
function askNumber(raw, uid) {            // giltigt och ledigt kortnummer, annars null
  const n = Math.round(Number(raw));
  if (!(n >= 1 && n <= 999)) { toast("Skriv ett nummer mellan 1 och 999"); return null; }
  if (backup[n] && backup[n].uid !== uid) { toast("Nummer " + n + " används redan av ett annat kort"); return null; }
  return n;
}
function setWant(raw) { const n = askNumber(raw); if (n) wantN = n; show(view); }
function prepareNew() { const n = askNumber(document.querySelector("#newN").value, view.uid); if (n) prepare(n, false); }
function renumber() {
  const raw = prompt("Nytt nummer för kortet (nu nr " + view.st.n + "):");
  if (raw === null) return;
  const n = askNumber(raw, view.uid);
  if (n) { view.st.n = n; touched(); }
}

function show(v) {
  if (!["edit", "fail", "armed"].includes(v.name)) disarm();          // lämnar man vyn gäller ändringen inte längre
  if (adding && !["wait", "edit"].includes(v.name)) stopAdding(true);
  view = v; clearTimeout(clearTimer);
  $("#adminBtn").textContent = secret ? "Meny" : "Admin";
  document.body.classList.toggle("wide", !!role);
  $("#adminBtn").hidden = !!(station || role); $("#lockBtn").hidden = !(station || role);
  app.innerHTML = ({ role: vRole, screenSetup: vScreenSetup, screen: vScreen, station: vStation, wait: vWait, card: vCard, blank: vBlank, bad: vBad, edit: vEdit, fail: vFail, armed: vArmed,
                     menu: vMenu, list: vList, levels: vLevels, bonus: vBonus, sync: vSync, log: vLog }[v.name])(v);
  // ett avläst kort ligger inte kvar på skärmen till nästa person
  if (["card", "blank", "bad"].includes(v.name) || (v.name === "edit" && !pending))
    clearTimer = setTimeout(() => show({ name: "wait" }), 25000);
}

function armQuick(k, d) { arm({ quick: [k, d] }); show({ name: "armed" }); }

function progress(st) {
  const cost = st.g, name = levels[st.l] ? levels[st.l].name : "nästa penna";

  const missing = Math.max(0, cost - st.s);
  const meter = cost <= 12
    ? `<div class="slots" style="font-size:${cost <= 6 ? 30 : cost <= 9 ? 25 : 21}px">${Array.from({ length: cost }, (_, i) => `<span class="${i < st.s ? "full" : ""}">⭐</span>`).join("")}</div>`
    : `<div class="bar"><i style="width:${Math.min(100, Math.round(100 * st.s / cost))}%"></i></div>`;
  return meter + `<p class="goal">${missing ? `<b>${missing}</b> kvar till <b>${esc(name)}</b>`
    : `🎉 Du kan uppgradera till <b>${esc(name)}</b>!`}</p>`;
}

function editDelta(st, orig) {            // t.ex. ["+2 ⭐", "−1 ✏️"]
  const sign = (d) => (d > 0 ? "+" : "−") + Math.abs(d);
  const out = [["s", "⭐"], ["e", "🧽"], ["p", "✏️"]].filter(([k]) => st[k] !== orig[k]).map(([k, icon]) => `${sign(st[k] - orig[k])} ${icon}`);
  if (st.l !== orig.l) out.push("ny penna: " + levelName(st.l));
  if (st.n !== orig.n) out.push(`nr ${orig.n} → ${st.n}`);
  return out;
}

// Varje ändring väntar direkt på ett blipp av samma kort: ingen extra spara-knapp att glömma.
function touched() {
  const changed = ["n", "s", "e", "p", "l"].some((k) => view.st[k] !== view.orig[k]);
  if (changed) arm({ uid: view.uid, state: view.st, oldN: view.orig.n }); else { disarm(); view.grown = false; }
  view.saved = false; view.note = ""; view.again = null; view.still = true;
  show(view);
}
function bump(k, d) { view.st[k] = Math.max(0, view.st[k] + d); touched(); }
function upgrade() { const c = nextCost(view.st.l); if (view.st.s >= c) { view.st.s -= c; view.st.l += 1; } touched(); }
function trade(k, value) { if (view.st[k] > 0) { view.st[k] -= 1; view.st.s += value; } touched(); }
function undoEdit() { view.st = { ...view.orig }; touched(); }

function prepare(n, fromBackup) {      // tomt/ogiltigt kort: bestäm innehållet, skriv vid nästa blipp

  arm({ uid: view.uid, state, created: !fromBackup, text: `Då skrivs kort nr ${n} till kortet.` });
  show({ name: "armed" });
}

const GH_FILE = "blippkort-data.json";

function setCloud(state, info) {
  syncInfo = info; const el = $("#cloud"); if (!el) return;
  el.hidden = !gh; el.textContent = { ok: "☁️✓", busy: "☁️…", err: "☁️⚠️" }[state] || "☁️"; el.title = info;

function mergeData(r) {                    // slå ihop registret med det som finns i enheten
  done = [...new Set([...(r.done || []), ...done])].slice(-400);
  const cards = { ...(r.cards || {}) };
  for (const [n, c] of Object.entries(backup)) if (!cards[n] || c.c >= cards[n].c) cards[n] = c;
  const byUid = {};                        // ett kort som bytt nummer ska inte finnas kvar under det gamla
  for (const [n, c] of Object.entries(cards)) if (!byUid[c.uid] || c.c > cards[byUid[c.uid]].c) byUid[c.uid] = n;

    if (!done.includes(g.id) && !(queue[n] || []).some((x) => x.id === g.id)) (queue[n] = queue[n] || []).push(g);

  const seen = new Set();

  const before = JSON.stringify(snapshot());
  try {
    for (let i = 0; ; i++) {
      // "Har något ändrats sedan sist?" Oförändrat svar (304) är pyttelitet och räknas inte mot GitHubs gräns.
      const res = await ghCall("GET", undefined, known && known.etag);

    if (JSON.stringify(snapshot()) !== before && ["list", "log"].includes(view.name)) show(view);
    if (role) screenUpdate();

    reader.onreading = (e) => onTap(e.serialNumber, e.message);
    reader.onreadingerror = () => toast("Kunde inte läsa kortet, försök igen");
    $("#nfcBtn").hidden = true; show(view);
  } catch (e) { reader = null; toast("NFC kunde inte startas. Är NFC påslaget i mobilen?"); }
};

if (!("NDEFReader" in window)) $("#nfcBtn").hidden = true;      // ingen NFC här: visa inte en knapp som inte kan fungera
// ---------- helskärm + håll skärmen vaken ----------
let kiosk = false, wakeLock = null;
async function keepAwake() {              // låset släpps av webbläsaren när sidan döljs, så det tas om när den syns igen
  if (!kiosk || !("wakeLock" in navigator) || document.visibilityState !== "visible") return false;
  if (wakeLock && wakeLock.released === false) return true;      // redan vaken
  try { wakeLock = await navigator.wakeLock.request("screen"); return true; } catch { return false; }
}
function paintKiosk() {
  $("#fsBtn").classList.toggle("on", kiosk);
  $("#fsIcon").setAttribute("d", kiosk ? "M7 3v4H3M17 7h-4V3M13 17v-4h4M3 13h4v4" : "M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4");
}
async function toggleKiosk() {
  if (kiosk) {
    kiosk = false; paintKiosk();
    try { if (wakeLock) await wakeLock.release(); } catch {} wakeLock = null;
    try { if (document.fullscreenElement) await document.exitFullscreen(); } catch {}
    return;
  }
  kiosk = true; paintKiosk();
  let full = false;
  try { await document.documentElement.requestFullscreen({ navigationUI: "hide" }); full = true; } catch {}
  const awake = await keepAwake();
  toast(full && awake ? "Helskärm på. Skärmen hålls vaken."
    : awake ? "Skärmen hålls vaken. Helskärm stöds inte i den här webbläsaren."
    : full ? "Helskärm på, men den här webbläsaren kan inte hålla skärmen vaken."
    : "Den här webbläsaren stöder varken helskärm eller vaken skärm.");
  if (!full && !awake) { kiosk = false; paintKiosk(); }
}
document.addEventListener("fullscreenchange", () => {   // lämnar man helskärm (t.ex. med bakåt eller Esc) släpps också skärmen
  if (!document.fullscreenElement && kiosk && document.fullscreenEnabled) toggleKiosk();
});
document.addEventListener("visibilitychange", keepAwake);

show({ name: station && secret ? "station" : role ? "screen" : "wait" });
if (gh) { setCloud("", syncInfo); sync(); }
</script>
